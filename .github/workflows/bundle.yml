name: Handle Bundle Workflow

# When a PR is labelled "Bundle"/"bundle", build the 5 tool JS bundles
# (content-hashed), upload them to S3, commit the regenerated
# js-side-menu-config.php back to the PR, and comment the S3 URLs.
#
# Requires these repo secrets (same as skm): AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, AWS_REGION_SK. GITHUB_TOKEN is provided automatically.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  build:
    if: contains(github.event.label.name, 'Bundle') || contains(github.event.label.name, 'bundle')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Snapshot the committed bundle names
        run: cp js-side-menu-config.php "$RUNNER_TEMP/config.before.php"

      - name: Build the bundles (hashed) + regenerate js-side-menu-config.php
        run: npm run build

      - name: Find changed bundle files
        id: find_bundle
        run: |
          # js/production/ is gitignored here (unlike skm, which commits every
          # hashed bundle), so `git diff` can't tell us what changed. The
          # committed js-side-menu-config.php is the equivalent snapshot: it
          # records the filenames currently live in production. Bundle names are
          # content-hashed, so a name that appears in the regenerated config but
          # not in the committed one means that tool's source actually changed.
          names() { grep -oE '[a-z0-9-]+-bundle-[0-9a-f]+\.js' "$1" | sort -u; }
          names "$RUNNER_TEMP/config.before.php" > "$RUNNER_TEMP/before.txt" || true
          names js-side-menu-config.php > "$RUNNER_TEMP/after.txt" || true

          comm -13 "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" \
            | sed 's|^|js/production/pfn-proxy/|' > "$RUNNER_TEMP/changed.txt"

          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
            echo "No bundle files changed."
          else
            echo "Changed bundle files:"
            cat "$RUNNER_TEMP/changed.txt"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION_SK }}

      - name: Upload changed bundles to S3
        id: upload
        run: |
          S3_URLS=""
          UPLOADED=0
          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue
            KEY="s3://static.profootballnetwork.com/$FILE"
            if aws s3 ls "$KEY" > /dev/null 2>&1; then
              echo "$FILE already on S3 — skipping."
            else
              aws s3 cp "$FILE" "$KEY"
              echo "Uploaded $FILE"
            fi
            UPLOADED=$((UPLOADED + 1))
            S3_URLS="$S3_URLS"$'\n'"https://static.profootballnetwork.com/$FILE"
          done < "$RUNNER_TEMP/changed.txt"
          # stash the changed bundles' URLs for the PR comment
          echo "count=$UPLOADED" >> "$GITHUB_OUTPUT"
          echo "urls<<EOF" >> "$GITHUB_OUTPUT"
          echo "$S3_URLS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit regenerated config back to the PR
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add js-side-menu-config.php
          if git diff --cached --quiet; then
            echo "js-side-menu-config.php unchanged — nothing to commit."
          else
            git commit -m "chore: update bundle hashes [skip ci]"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Comment bundle URLs on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_COUNT: ${{ steps.upload.outputs.count }}
          UPLOAD_URLS: ${{ steps.upload.outputs.urls }}
        run: |
          if [ "${UPLOAD_COUNT:-0}" -eq 0 ]; then
            BODY="## No new bundles

          No tool source changed in this PR — every bundle hash is already live."
          else
            BODY="## Bundle files uploaded to S3:
          $UPLOAD_URLS"
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
